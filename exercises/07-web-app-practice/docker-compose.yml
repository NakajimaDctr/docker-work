services:
  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      - DB_HOST=db
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
    volumes:
      - db-data:/var/lib/postgresql/data

# named volume(名前付きボリューム)をDockerに登録する
# dbのvolumesで指定する。
# 本当の名前はdocker volume lsで確認できる。
volumes:
  db-data:
